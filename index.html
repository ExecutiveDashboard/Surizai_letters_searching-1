<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Search</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>window.pdfjsLib = window['pdfjs-dist/build/pdf'];</script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- ✅ QR CODE LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<script>

let lettersData = [];
let masterPdfBytes = null;
let backPagePdfBytes = null;

fetch('letters_from_docx.json')
  .then(res => res.json())
  .then(data => lettersData = data.letters);

fetch('No.pdf')
  .then(res => res.arrayBuffer())
  .then(buffer => masterPdfBytes = buffer);

fetch('Back PAge.pdf')
  .then(res => res.arrayBuffer())
  .then(buffer => backPagePdfBytes = buffer);

async function downloadLetterAsPDF(letterId, memberName) {

  const matchedLetter = lettersData.find(l => l.id === letterId);
  if (!matchedLetter) {
    alert("Letter data not found.");
    return;
  }

  const cnicValue = matchedLetter.cnic;

  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const loadingTask = pdfjsLib.getDocument({ data: masterPdfBytes.slice(0) });
  const pdf = await loadingTask.promise;

  let foundPageIndex = -1;
  const totalPages = pdf.numPages;
  const searchName = memberName.trim().toLowerCase();

  for (let i = 1; i <= totalPages; i++) {
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    const pageText = textContent.items.map(item => item.str).join(' ').toLowerCase();
    if (pageText.includes(searchName)) {
      foundPageIndex = i - 1;
      break;
    }
  }

  if (foundPageIndex === -1) {
    foundPageIndex = letterId - 1;
  }

  const { PDFDocument, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.load(masterPdfBytes);
  const newPdf = await PDFDocument.create();

  const [copiedPage] = await newPdf.copyPages(pdfDoc, [foundPageIndex]);
  newPdf.addPage(copiedPage);

  if (backPagePdfBytes) {
    const backPdfDoc = await PDFDocument.load(backPagePdfBytes);
    const backPages = backPdfDoc.getPageIndices();
    const copiedBackPages = await newPdf.copyPages(backPdfDoc, backPages);
    copiedBackPages.forEach(p => newPdf.addPage(p));
  }

  // ---------- QR PAGE ----------
  const qrDiv = document.createElement("div");
  new QRCode(qrDiv, {
    text: cnicValue,
    width: 200,
    height: 200
  });

  const qrCanvas = qrDiv.querySelector("canvas");
  const qrDataUrl = qrCanvas.toDataURL("image/png");
  const qrImageBytes = await fetch(qrDataUrl).then(res => res.arrayBuffer());
  const qrImage = await newPdf.embedPng(qrImageBytes);

  const qrPage = newPdf.addPage([595, 842]); // A4
  const { width, height } = qrPage.getSize();
  const qrSize = 200;

  qrPage.drawImage(qrImage, {
    x: (width - qrSize) / 2,
    y: (height - qrSize) / 2,
    width: qrSize,
    height: qrSize
  });

  qrPage.drawText("CNIC: " + cnicValue, {
    x: width / 2 - 100,
    y: (height - qrSize) / 2 - 30,
    size: 14,
    color: rgb(0, 0, 0)
  });

  const pdfBytes = await newPdf.save();
  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  saveAs(blob, memberName.replace(/\s+/g, '_') + ".pdf");
}

</script>

</body>
</html>
